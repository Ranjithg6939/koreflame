<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | KoreFlame Korean BBQ</title>
  <meta name="description" content="Set a new secure password for your KoreFlame dining account.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- KoreFlame Design System -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="bg-primary-app text-primary-app">

  <main id="main-content" class="min-vh-100 d-flex align-items-center justify-content-center py-5 px-3">
    <div class="w-100" style="max-width: 480px;">
      <div class="kf-card p-4 p-sm-5 shadow-lg border border-subtle">
        
        <!-- Brand Header -->
        <div class="text-center mb-4 auth-header">
          <a href="index.html" class="d-inline-flex align-items-center gap-2 mb-3 text-decoration-none">
            <div class="nav-brand-flame-wrap">
              <i data-lucide="flame" class="brand-flame-icon"></i>
            </div>
            <div class="nav-brand-text text-start">
              <span class="nav-brand-title" style="font-size: 1.45rem;">Kore<span class="brand-accent">Flame</span></span>
              <span class="nav-brand-sub" style="font-size: 0.62rem; letter-spacing: 0.12em;">PREMIUM SEOUL BBQ</span>
            </div>
          </a>
          <h3 class="mb-1 fw-extrabold">Set New Password</h3>
          <p class="text-secondary small mb-0">Create a new secure password for your dining account.</p>
        </div>

        <form id="kf-reset-password-form" novalidate autocomplete="on">
          <input type="hidden" id="reset-token" name="token">

          <div class="mb-3">
            <label class="form-label-custom" for="reset-new-password">New Password *</label>
            <div class="input-group">
              <input type="password" id="reset-new-password" name="new-password" autocomplete="new-password" class="form-control-custom border-end-0" placeholder="e.g. KoreFlame@2026!" required>
              <button class="btn btn-outline-secondary border border-start-0 text-muted password-toggle-btn" type="button" aria-label="Toggle password visibility">
                <i data-lucide="eye" style="width: 18px; height: 18px;"></i>
              </button>
            </div>
            <div class="form-feedback-error" id="reset-new-password-error" role="alert" aria-live="polite"></div>

            <!-- Live Password Strength Meter -->
            <div class="kf-password-strength mt-2" id="kf-password-strength-wrap" style="display: none;">
              <div class="kf-strength-bar">
                <div class="kf-strength-fill" id="kf-strength-fill"></div>
              </div>
              <div class="kf-strength-meta">
                <span class="text-secondary small">Security Strength:</span>
                <span class="kf-strength-label text-weak" id="kf-strength-label">Weak</span>
              </div>
              <div class="visually-hidden" aria-live="polite" id="kf-strength-announcer"></div>

              <ul class="kf-requirements-checklist" id="kf-requirements-checklist" aria-label="Password Requirements">
                <li class="kf-req-item" id="req-length">
                  <span class="kf-req-icon"><i data-lucide="circle" style="width: 12px; height: 12px;"></i></span>
                  <span>At least 8 characters</span>
                </li>
                <li class="kf-req-item" id="req-upper">
                  <span class="kf-req-icon"><i data-lucide="circle" style="width: 12px; height: 12px;"></i></span>
                  <span>One uppercase letter (A-Z)</span>
                </li>
                <li class="kf-req-item" id="req-lower">
                  <span class="kf-req-icon"><i data-lucide="circle" style="width: 12px; height: 12px;"></i></span>
                  <span>One lowercase letter (a-z)</span>
                </li>
                <li class="kf-req-item" id="req-number">
                  <span class="kf-req-icon"><i data-lucide="circle" style="width: 12px; height: 12px;"></i></span>
                  <span>One number (0-9)</span>
                </li>
                <li class="kf-req-item" id="req-special">
                  <span class="kf-req-icon"><i data-lucide="circle" style="width: 12px; height: 12px;"></i></span>
                  <span>One special symbol (!@#$)</span>
                </li>
              </ul>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label-custom" for="reset-confirm-password">Confirm New Password *</label>
            <div class="input-group">
              <input type="password" id="reset-confirm-password" name="confirm-password" autocomplete="new-password" class="form-control-custom border-end-0" placeholder="e.g. KoreFlame@2026!" required>
              <button class="btn btn-outline-secondary border border-start-0 text-muted password-toggle-btn" type="button" aria-label="Toggle password visibility">
                <i data-lucide="eye" style="width: 18px; height: 18px;"></i>
              </button>
            </div>
            <div class="form-feedback-error" id="reset-confirm-password-error" role="alert" aria-live="polite"></div>
          </div>

          <button type="submit" class="btn-flame w-100 py-3 mb-3" id="btn-reset-submit">
            <span>Update Password</span>
          </button>
        </form>

        <div class="text-center pt-3 border-top border-subtle">
          <a href="login.html" class="small text-flame fw-bold d-inline-flex align-items-center gap-1">
            <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
            <span>Back to Sign In</span>
          </a>
        </div>

      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/state.js?v=auth2026"></script>
  <script src="assets/js/toast.js?v=toptoast"></script>
  <script src="assets/js/validator.js?v=auth2026"></script>
  <script src="assets/js/auth.js?v=auth2026"></script>
  <script>
    if (window.lucide) window.lucide.createIcons();
  </script>
</body>
</html>
