<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KoreFlame — Register for Guest Loyalty & Table Perks</title>
  <meta name="description" content="Create a KoreFlame guest account to earn 200 welcome points, unlock priority table bookings, and save your favorite barbecue cuts.">
  <link rel="canonical" href="https://koreflame.com/register.html">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="stylesheet" href="assets/css/style.css?v=golden7">
  <link rel="stylesheet" href="assets/css/responsive.css?v=golden7">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-between">
  <a href="#main-content" class="skip-to-content">Skip to main content</a>

  <!-- Minimal Brand Header -->
  <header class="py-3 border-bottom border-subtle">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="index.html" class="nav-brand-logo" aria-label="KoreFlame Korean BBQ">
        <div class="kf-brand-logo-wrap">
          <div class="kf-logo-aura"></div>
          <img src="assets/images/logo.png" alt="KoreFlame Korean BBQ" class="brand-logo-img">
          <div class="kf-steam-wrap">
            <span class="kf-steam-particle s1"></span>
            <span class="kf-steam-particle s2"></span>
            <span class="kf-steam-particle s3"></span>
          </div>
        </div>
        <div class="nav-brand-text">
          <span class="nav-brand-title">Kore<span class="brand-accent">Flame</span></span>
          <span class="nav-brand-sub">PREMIUM SEOUL BBQ</span>
        </div>
      </a>
      <div class="d-flex align-items-center gap-2">
        <button type="button" class="btn-icon-nav kf-theme-toggle" aria-label="Toggle Theme"><i data-lucide="sun-medium"></i></button>
        <a href="index.html" class="btn-flame-outline btn-sm-custom">Back to Site</a>
      </div>
    </div>
  </header>

  <!-- Register Container -->
  <main id="main-content" class="py-5 flex-grow-1 d-flex align-items-center">
    <div class="container" style="max-width: 520px;">
      <div class="kf-card p-3 p-sm-4 p-md-5">
        
        <div class="text-center mb-4">
          <a href="index.html" class="nav-brand-logo d-inline-flex align-items-center justify-content-center gap-2 mb-3" aria-label="KoreFlame Korean BBQ">
            <div class="kf-brand-logo-wrap" style="width: 44px; height: 44px;">
              <div class="kf-logo-aura"></div>
              <img src="assets/images/logo.png" alt="KoreFlame Korean BBQ" class="brand-logo-img">
              <div class="kf-steam-wrap">
                <span class="kf-steam-particle s1"></span>
                <span class="kf-steam-particle s2"></span>
                <span class="kf-steam-particle s3"></span>
              </div>
            </div>
            <div class="nav-brand-text text-start">
              <span class="nav-brand-title" style="font-size: 1.45rem;">Kore<span class="brand-accent">Flame</span></span>
              <span class="nav-brand-sub" style="font-size: 0.62rem; letter-spacing: 0.12em;">PREMIUM SEOUL BBQ</span>
            </div>
          </a>
          <h3 class="mb-1 fw-extrabold">Create Account</h3>
          <p class="text-secondary small mb-0">Join KoreFlame Club and receive 200 complimentary loyalty points immediately.</p>
        </div>

        <!-- Social Signup Options -->
        <div class="row g-2 mb-3">
          <div class="col-6">
            <button type="button" class="btn-social-auth w-100" id="btn-signup-apple" aria-label="Sign up with Apple">
              <svg class="social-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.93-2.85-.9.04-1.99.6-2.63 1.35-.57.65-1.07 1.72-.94 2.74 1 .08 2.02-.49 2.64-1.24"/>
              </svg>
              <span>Apple</span>
            </button>
          </div>
          <div class="col-6">
            <button type="button" class="btn-social-auth w-100" id="btn-signup-google" aria-label="Sign up with Google">
              <svg class="social-icon" width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
              </svg>
              <span>Google</span>
            </button>
          </div>
        </div>

        <div class="auth-divider">
          <span>or sign up with email</span>
        </div>

        <!-- Registration Form -->
        <form id="kf-register-form" novalidate>
          <div class="mb-3">
            <label class="form-label-custom" for="reg-name">Full Name *</label>
            <input type="text" id="reg-name" class="form-control-custom" placeholder="e.g. Min-Ji Kim" required>
            <div class="form-feedback-error" id="reg-name-error"></div>
          </div>

          <div class="mb-3">
            <label class="form-label-custom" for="reg-email">Email Address *</label>
            <input type="email" id="reg-email" class="form-control-custom" placeholder="e.g. guest@domain.com" required>
            <div class="form-feedback-error" id="reg-email-error"></div>
          </div>

          <div class="mb-3">
            <label class="form-label-custom" for="reg-phone">Mobile Phone Number</label>
            <input type="tel" id="reg-phone" class="form-control-custom" placeholder="e.g. +1 (555) 382-7492">
            <div class="form-feedback-error" id="reg-phone-error"></div>
          </div>

          <div class="mb-3">
            <label class="form-label-custom" for="reg-password">Password (minimum 6 characters) *</label>
            <div class="input-group">
              <input type="password" id="reg-password" class="form-control-custom border-end-0" placeholder="e.g. ••••••••" required>
              <button class="btn btn-outline-secondary border border-start-0 text-muted password-toggle-btn" type="button" aria-label="Toggle password visibility">
                <i data-lucide="eye" style="width: 18px; height: 18px;"></i>
              </button>
            </div>
            <div class="form-feedback-error" id="reg-password-error"></div>
          </div>

          <div class="mb-4">
            <label class="form-label-custom" for="reg-confirm-password">Confirm Password *</label>
            <div class="input-group">
              <input type="password" id="reg-confirm-password" class="form-control-custom border-end-0" placeholder="e.g. ••••••••" required>
              <button class="btn btn-outline-secondary border border-start-0 text-muted password-toggle-btn" type="button" aria-label="Toggle password visibility">
                <i data-lucide="eye" style="width: 18px; height: 18px;"></i>
              </button>
            </div>
            <div class="form-feedback-error" id="reg-confirm-password-error"></div>
          </div>

          <div class="form-check d-flex align-items-center gap-2 mb-4">
            <input class="form-check-input m-0 flex-shrink-0" type="checkbox" id="agreeTerms" required checked>
            <label class="form-check-label small text-secondary" for="agreeTerms">
              I agree to table reservation policies and loyalty terms.
            </label>
          </div>
          <div class="form-feedback-error" id="agreeTerms-error" style="margin-top: -0.75rem; margin-bottom: 1rem;"></div>

          <button type="submit" class="btn-flame w-100 py-3 mb-3">
            <span>Create Account & Claim 200 Points</span>
          </button>
        </form>

        <div class="text-center pt-3 border-top border-subtle">
          <span class="small text-muted">Already have a dining account? </span>
          <a href="login.html" class="small text-flame fw-bold">Sign In Here</a>
        </div>

      </div>
    </div>
  </main>

  

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/state.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/validator.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    if (window.lucide) window.lucide.createIcons();
  </script>
</body>
</html>
